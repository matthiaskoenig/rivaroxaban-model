[project]
site_name = "Physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model of rivaroxaban"
site_url = "https://matthiaskoenig.github.io/rivaroxaban-model/"
site_description = "This repository provides the rivaroxaban physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model: the dose and food dependent dissolution and the absorption, the tissue distribution, the hepatic metabolism (CYP3A4, CYP2J2, hydrolysis), the renal excretion by filtration and active secretion, the excretion of the metabolites and the anticoagulant effects (PT, aPTT, inhibition of factor Xa)."
site_author = "Elisabetta Casabianca, Mariia Myshkina and Matthias König"

copyright = "Copyright &copy; 2025-2026 Elisabetta Casabianca, Mariia Myshkina and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/rivaroxaban-model"
repo_name = "matthiaskoenig/rivaroxaban-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/rivaroxaban-model"
